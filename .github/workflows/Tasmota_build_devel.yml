name: Build_development

on:
  workflow_dispatch:
  push:
    branches: [ development ]

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies & Create In-Memory Patch
        run: |
          pip install platformio
          cp ./platformio_override_sample.ini ./platformio_override.ini
          
          # 创建编译期内存补丁脚本
          cat << 'EOF' > patch_scons.py
          import sys, types
          try:
              Import("env")
          except:
              pass
          m = types.ModuleType("SCons.Tool.FortranCommon")
          m.Dialectizer = lambda *a, **k: None
          m.add_f77_to_env = lambda *a, **k: None
          m.add_f90_to_env = lambda *a, **k: None
          m.add_f95_to_env = lambda *a, **k: None
          m.add_fortran_to_env = lambda *a, **k: None
          sys.modules["SCons.Tool.FortranCommon"] = m
          print(">>> SCons.Tool.FortranCommon dummy module injected successfully! <<<")
          EOF

          # 将补丁加入 PlatformIO 构建流程
          echo -e "\n[env]\nextra_scripts = pre:patch_scons.py\n" >> ./platformio_override.ini

      - name: Add SHA to footer
        run: |
          COMMIT_SHA_LONG=$(git rev-parse --short HEAD || echo "")
          SHA=${COMMIT_SHA_LONG::7}
          sed -i -e "s/TASMOTA_SHA_SHORT/TASMOTA_SHA_SHORT $SHA-/g" ./tasmota/include/tasmota_version.h
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e tasmota-CN
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-CN
          path: |
            build_output/firmware/*.bin.gz
            .pio/build/tasmota-CN/*.bin.gz
            .pio/build/tasmota-CN/*.bin
